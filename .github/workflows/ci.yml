name: CI

on:
  push:
    branches: [main, master]
  # Deliberately unfiltered by base branch. Restricting this to [main, master] meant a
  # stacked PR (one phase branch based on the previous one, opened while that one is
  # still in review) got no checks at all, so the "wait for CI before merging" step in
  # CLAUDE.md's git workflow silently had nothing to wait for.
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v
