# Central config for the AML alert-triage pipeline.
# Every script/notebook reads paths, seeds, and thresholds from here — no magic numbers in src/.

seed: 42

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  modelling_table: "data/processed/features.parquet"
  models_dir: "models"
  figures_dir: "reports/figures"
  results_md: "reports/results.md"
  demo_artifact: "app/data/demo_alerts.parquet"
  demo_metrics: "app/data/demo_metrics.json"

dataset:
  kaggle_handle: "ealtman2019/ibm-transactions-for-anti-money-laundering-aml"
  split: "HI-Small"          # do not switch splits without updating PLAN.md's sizing assumptions
  label_column: "Is Laundering"

windows:
  rolling_days: [1, 7, 30]

graph_features:
  cycle_max_length: 3    # bounds nx.simple_cycles enumeration on the daily account graph
  lookback_days: 7       # trailing window the daily graph snapshot is built from, not all history

rules_baseline:
  large_amount_threshold_usd: 10000  # US BSA/CTR reporting threshold — applied to USD-equivalent amount
  structuring_window_hours: 24
  structuring_min_txn_count: 3
  structuring_threshold_fraction: 0.9  # "just under" = within this fraction of large_amount_threshold_usd
  pass_through_window_hours: 2

# Approximate, static FX rates to USD for the dataset's window (Sept 2022), used only to make
# the large-amount/structuring thresholds currency-comparable. A real deployment would use
# point-in-time FX rates per transaction date, not one static table — documented simplification,
# not an oversight (see reports/results.md).
fx_rates_to_usd:
  US Dollar: 1.0
  Euro: 1.00
  UK Pound: 1.15
  Swiss Franc: 1.04
  Canadian Dollar: 0.74
  Australian Dollar: 0.65
  Yen: 0.0071
  Yuan: 0.143
  Rupee: 0.0125
  Shekel: 0.29
  Ruble: 0.0167
  Mexican Peso: 0.05
  Saudi Riyal: 0.267
  Brazil Real: 0.19
  Bitcoin: 19500.0

split:
  method: "time_ordered"             # never random k-fold — see CLAUDE.md leakage constraint
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2

model:
  primary: "xgboost"                 # xgboost | lightgbm
  imbalance_handling: "scale_pos_weight"  # prefer over naive oversampling per brief

evaluation:
  precision_at_k: [100, 500, 1000, 5000]

monitoring:
  psi_bins: 10                       # quantile bins, derived from the REFERENCE split only
  psi_epsilon: 1.0e-6                # proportion floor for empty bins — keeps ln(0) from going to -inf
  psi_thresholds:                    # conventional credit-risk reading, not a derived result
    moderate: 0.10
    significant: 0.25
  time_slice_freq: "D"               # HI-Small spans only ~17-18 days, so daily is the finest useful slice
  min_slice_size: 1000               # below this, PSI is sampling noise rather than drift

demo_artifact:
  target_rows: 30000                 # all positives + stratified negative sample, target <20MB parquet
